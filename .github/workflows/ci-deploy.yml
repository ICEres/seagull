name: CI Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: seagull-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_BACKEND_DYNAMODB_TABLE: ${{ vars.TF_BACKEND_DYNAMODB_TABLE }}
  TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY || 'seagull/dev/terraform.tfstate' }}
  TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || vars.AWS_REGION || 'ap-southeast-2' }}
  TF_VAR_aws_profile: ""
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  TF_VAR_agent_webhook_signing_secret: ${{ secrets.AGENT_WEBHOOK_SIGNING_SECRET }}
  TF_VAR_ai_provider_admin_secret: ${{ secrets.AI_PROVIDER_ADMIN_SECRET || secrets.MCP_CONNECTOR_ADMIN_SECRET }}
  TF_VAR_mcp_connector_admin_secret: ${{ secrets.MCP_CONNECTOR_ADMIN_SECRET }}
  TF_VAR_mcp_dev_token: ${{ secrets.MCP_DEV_TOKEN }}

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Python tests
        run: |
          make phase0-test
          make safety-gateway-test
          make social-api-test
          make ai-provider-test
          make message-hub-test
          make mcp-connector-test
          make local-agent-test

  web-test-build:
    name: Web test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.0.0-dev.1005 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: make web-test

      - name: Build web
        run: make web-build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  router-test-build:
    name: Router test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/message-hub/router/go.mod
          cache-dependency-path: apps/message-hub/router/go.sum

      - name: Test router
        run: make message-router-test

      - name: Build router
        run: make message-router-build

      - name: Upload router artifact
        uses: actions/upload-artifact@v4
        with:
          name: message-router-bootstrap
          path: infra/terraform/envs/dev/.terraform/build/message-router/bootstrap
          if-no-files-found: error
          retention-days: 1

  lambda-builds:
    name: Lambda package builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Lambda packages
        run: |
          make safety-gateway-build
          make social-api-build
          make ai-provider-build
          make mcp-connector-build

      - name: Upload Lambda package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            infra/terraform/envs/dev/.terraform/build/safety-gateway/package
            infra/terraform/envs/dev/.terraform/build/social-api/package
            infra/terraform/envs/dev/.terraform/build/ai-provider/package
            infra/terraform/envs/dev/.terraform/build/mcp-connector/package
          if-no-files-found: error
          retention-days: 1

  terraform-fmt:
    name: Terraform format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - web-test-build
      - router-test-build
      - lambda-builds
      - terraform-fmt

    steps:
      - name: Check deploy configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::$1 is required for dev deploy"
              missing=1
            fi
          }

          require AWS_ROLE_TO_ASSUME
          require TF_BACKEND_BUCKET
          require TF_BACKEND_DYNAMODB_TABLE
          require TF_VAR_agent_webhook_signing_secret
          require TF_VAR_ai_provider_admin_secret
          require TF_VAR_mcp_connector_admin_secret

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Lambda package artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: infra/terraform/envs/dev/.terraform/build

      - name: Download router artifact
        uses: actions/download-artifact@v4
        with:
          name: message-router-bootstrap
          path: infra/terraform/envs/dev/.terraform/build/message-router

      - name: Restore router executable bit
        run: chmod +x infra/terraform/envs/dev/.terraform/build/message-router/bootstrap

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Initialize Terraform
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        working-directory: infra/terraform/envs/dev
        run: terraform validate

      - name: Plan dev deploy
        working-directory: infra/terraform/envs/dev
        run: terraform plan -input=false -out=tfplan

      - name: Apply dev deploy
        working-directory: infra/terraform/envs/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Create social smoke token
        shell: bash
        run: |
          set -euo pipefail

          USER_POOL_ID="$(terraform -chdir=infra/terraform/envs/dev output -raw social_auth_user_pool_id)"
          CLIENT_ID="$(terraform -chdir=infra/terraform/envs/dev output -raw social_auth_client_id)"
          USERNAME="ci-social-smoke@example.com"
          PASSWORD="$(python3 -c 'import secrets, string; alphabet = string.ascii_letters + string.digits; print("".join(secrets.choice(alphabet) for _ in range(32)) + "Aa1")')"

          if ! aws cognito-idp admin-get-user --user-pool-id "$USER_POOL_ID" --username "$USERNAME" >/dev/null 2>&1; then
            aws cognito-idp admin-create-user \
              --user-pool-id "$USER_POOL_ID" \
              --username "$USERNAME" \
              --user-attributes Name=email,Value="$USERNAME" Name=email_verified,Value=true \
              --message-action SUPPRESS
          fi

          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" \
            --username "$USERNAME" \
            --password "$PASSWORD" \
            --permanent

          TOKEN_JSON="$(aws cognito-idp initiate-auth \
            --auth-flow USER_PASSWORD_AUTH \
            --client-id "$CLIENT_ID" \
            --auth-parameters USERNAME="$USERNAME",PASSWORD="$PASSWORD")"
          ID_TOKEN="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["AuthenticationResult"]["IdToken"])' <<<"$TOKEN_JSON")"

          echo "::add-mask::$ID_TOKEN"
          echo "SOCIAL_API_BEARER_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      - name: Smoke dev deploy
        run: |
          make aws-dev-smoke
          make aws-dev-safety-smoke
          make aws-dev-ai-smoke
          make aws-dev-social-smoke
          make aws-dev-web-smoke
          make aws-dev-router-smoke
