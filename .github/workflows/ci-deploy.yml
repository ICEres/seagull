name: CI Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: seagull-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_BACKEND_DYNAMODB_TABLE: ${{ vars.TF_BACKEND_DYNAMODB_TABLE }}
  TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY || 'seagull/dev/terraform.tfstate' }}
  TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || vars.AWS_REGION || 'ap-southeast-2' }}
  TF_VAR_aws_profile: ""
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  TF_VAR_agent_webhook_signing_secret: ${{ secrets.AGENT_WEBHOOK_SIGNING_SECRET }}
  TF_VAR_mcp_connector_admin_secret: ${{ secrets.MCP_CONNECTOR_ADMIN_SECRET }}
  TF_VAR_mcp_dev_token: ${{ secrets.MCP_DEV_TOKEN }}

jobs:
  deploy-dev:
    name: Test and deploy dev
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::$1 is required for dev deploy"
              missing=1
            fi
          }

          require AWS_ROLE_TO_ASSUME
          require TF_BACKEND_BUCKET
          require TF_BACKEND_DYNAMODB_TABLE
          require TF_VAR_agent_webhook_signing_secret
          require TF_VAR_mcp_connector_admin_secret

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/message-hub/router/go.mod
          cache-dependency-path: apps/message-hub/router/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.0.0-dev.1005 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Run tests
        run: |
          make phase0-test
          make safety-gateway-test
          make social-api-test
          make message-hub-test
          make mcp-connector-test
          make message-router-test
          make phase4-test

      - name: Build deploy artifacts
        run: |
          make safety-gateway-build
          make social-api-build
          make mcp-connector-build
          make message-router-build
          make web-build

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize Terraform
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        working-directory: infra/terraform/envs/dev
        run: terraform validate

      - name: Plan dev deploy
        working-directory: infra/terraform/envs/dev
        run: terraform plan -input=false -out=tfplan

      - name: Apply dev deploy
        working-directory: infra/terraform/envs/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Smoke dev deploy
        run: |
          make aws-dev-smoke
          make aws-dev-safety-smoke
          make aws-dev-social-smoke
          make aws-dev-web-smoke
          make aws-dev-router-smoke
