name: CI Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: seagull-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_BACKEND_DYNAMODB_TABLE: ${{ vars.TF_BACKEND_DYNAMODB_TABLE }}
  TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY || 'seagull/dev/terraform.tfstate' }}
  TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || vars.AWS_REGION || 'ap-southeast-2' }}
  TF_VAR_aws_profile: ""
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  TF_VAR_root_domain: ${{ vars.ROOT_DOMAIN || 'gulls.ai' }}
  TF_VAR_message_api_domain: ${{ vars.MESSAGE_API_DOMAIN || 'fishing.gulls.ai' }}
  TF_VAR_web_domain_name: ${{ vars.WEB_DOMAIN_NAME || 'sea.gulls.ai' }}
  TF_VAR_landing_domain_name: ${{ vars.LANDING_DOMAIN_NAME || 'gulls.ai' }}
  TF_VAR_admin_domain_name: ${{ vars.ADMIN_DOMAIN_NAME || 'admin.gulls.ai' }}
  TF_VAR_mcp_domain_name: ${{ vars.MCP_DOMAIN_NAME || 'mcp.gulls.ai' }}
  TF_VAR_agent_webhook_signing_secret: ${{ secrets.AGENT_WEBHOOK_SIGNING_SECRET }}
  TF_VAR_ai_provider_admin_secret: ${{ secrets.AI_PROVIDER_ADMIN_SECRET }}
  TF_VAR_mcp_connector_admin_secret: ${{ secrets.MCP_CONNECTOR_ADMIN_SECRET }}
  TF_VAR_mcp_dev_token: ${{ secrets.MCP_DEV_TOKEN }}
  TF_VAR_safety_gateway_admin_secret: ${{ secrets.SAFETY_GATEWAY_ADMIN_SECRET || secrets.AGENT_WEBHOOK_SIGNING_SECRET }}
  AGENT_WEBHOOK_SIGNING_SECRET: ${{ secrets.AGENT_WEBHOOK_SIGNING_SECRET }}
  AI_PROVIDER_ADMIN_SECRET: ${{ secrets.AI_PROVIDER_ADMIN_SECRET }}
  MCP_CONNECTOR_ADMIN_SECRET: ${{ secrets.MCP_CONNECTOR_ADMIN_SECRET }}
  MCP_DEV_TOKEN: ${{ secrets.MCP_DEV_TOKEN }}
  SAFETY_GATEWAY_ADMIN_SECRET: ${{ secrets.SAFETY_GATEWAY_ADMIN_SECRET || secrets.AGENT_WEBHOOK_SIGNING_SECRET }}

jobs:
  layer-folder-check:
    name: ${{ matrix.layer }} layer folder shape
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layer:
          - gulls
          - seagulls
          - pet
          - agent-request

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check layer folders
        shell: bash
        run: |
          set -euo pipefail
          test -d "packages/${{ matrix.layer }}"
          test -d "packages/${{ matrix.layer }}/docs"
          test -d "packages/${{ matrix.layer }}/connect"

  gulls-python-tests:
    name: Gulls layer Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run Gulls Python tests
        run: |
          make phase0-test
          make sdk-test
          make safety-gateway-test
          make ai-provider-test
          make message-hub-test
          make mcp-connector-test

  sea-gull-python-tests:
    name: Sea-gull layer Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run Sea-gull Python tests
        run: make social-api-test

  sea-gull-web-test-build:
    name: Sea-gull layer web test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.0.0-dev.1005 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: make web-test

      - name: Build web
        run: make web-build

      - name: Upload web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: packages/seagulls/apps/web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Test landing
        run: make landing-test

      - name: Build landing
        run: make landing-build

      - name: Upload landing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: landing-dist
          path: packages/seagulls/apps/landing/dist
          if-no-files-found: error
          retention-days: 1

  gulls-router-test-build:
    name: Gulls layer router test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: packages/gulls/services/message-hub/router/go.mod
          cache-dependency-path: packages/gulls/services/message-hub/router/go.sum

      - name: Test router
        run: make message-router-test

      - name: Build router
        run: make message-router-build

      - name: Upload router artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: message-router-bootstrap
          path: infra/terraform/envs/dev/.terraform/build/message-router/bootstrap
          if-no-files-found: error
          retention-days: 1

  gulls-local-agent-test:
    name: Gulls layer local agent CLI tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: packages/gulls/connect/local-agent/go.mod
          cache-dependency-path: packages/gulls/connect/local-agent/go.sum

      - name: Test local agent CLI
        run: make local-agent-test

  gulls-lambda-builds:
    name: Gulls layer Lambda package builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Gulls Lambda packages
        run: |
          make safety-gateway-build
          make ai-provider-build
          make mcp-connector-build

      - name: Upload Gulls Lambda package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gulls-lambda-packages
          path: |
            infra/terraform/envs/dev/.terraform/build/safety-gateway/package
            infra/terraform/envs/dev/.terraform/build/ai-provider/package
            infra/terraform/envs/dev/.terraform/build/mcp-connector/package
          if-no-files-found: error
          retention-days: 1

  sea-gull-lambda-builds:
    name: Sea-gull layer Lambda package builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Sea-gull Lambda packages
        run: make social-api-build

      - name: Upload Sea-gull Lambda package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sea-gull-lambda-packages
          path: infra/terraform/envs/dev/.terraform/build/social-api/package
          if-no-files-found: error
          retention-days: 1

  terraform-fmt:
    name: Terraform format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate domain Terraform
        working-directory: infra/terraform/envs/domain
        run: |
          terraform init -backend=false
          terraform validate

  deploy-dev:
    name: Deploy dev
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - layer-folder-check
      - gulls-python-tests
      - sea-gull-python-tests
      - sea-gull-web-test-build
      - gulls-router-test-build
      - gulls-local-agent-test
      - gulls-lambda-builds
      - sea-gull-lambda-builds
      - terraform-fmt

    steps:
      - name: Check deploy configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::$1 is required for dev deploy"
              missing=1
            fi
          }

          require AWS_ROLE_TO_ASSUME
          require TF_BACKEND_BUCKET
          require TF_BACKEND_DYNAMODB_TABLE
          require AGENT_WEBHOOK_SIGNING_SECRET
          require SAFETY_GATEWAY_ADMIN_SECRET

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download Gulls Lambda package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gulls-lambda-packages
          path: infra/terraform/envs/dev/.terraform/build

      - name: Download Sea-gull Lambda package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sea-gull-lambda-packages
          path: infra/terraform/envs/dev/.terraform/build/social-api/package

      - name: Download router artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: message-router-bootstrap
          path: infra/terraform/envs/dev/.terraform/build/message-router

      - name: Restore router executable bit
        run: chmod +x infra/terraform/envs/dev/.terraform/build/message-router/bootstrap

      - name: Download web artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist
          path: packages/seagulls/apps/web/dist

      - name: Download landing artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: landing-dist
          path: packages/seagulls/apps/landing/dist

      - name: Check deploy artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/terraform/envs/dev/.terraform/build/safety-gateway/package/lambda_function.py
          test -f infra/terraform/envs/dev/.terraform/build/ai-provider/package/lambda_function.py
          test -f infra/terraform/envs/dev/.terraform/build/ai-provider/package/ai_worker.py
          test -f infra/terraform/envs/dev/.terraform/build/mcp-connector/package/lambda_function.py
          test -f infra/terraform/envs/dev/.terraform/build/social-api/package/lambda_function.py
          test -x infra/terraform/envs/dev/.terraform/build/message-router/bootstrap
          test -f packages/seagulls/apps/web/dist/index.html
          test -f packages/seagulls/apps/landing/dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.6"

      - name: Initialize Terraform
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        working-directory: infra/terraform/envs/dev
        run: terraform validate

      - name: Plan dev deploy
        working-directory: infra/terraform/envs/dev
        run: terraform plan -input=false -out=tfplan

      - name: Apply dev deploy
        working-directory: infra/terraform/envs/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Create social smoke token
        shell: bash
        run: |
          set -euo pipefail

          USER_POOL_ID="$(terraform -chdir=infra/terraform/envs/dev output -raw social_auth_user_pool_id)"
          CLIENT_ID="$(terraform -chdir=infra/terraform/envs/dev output -raw social_auth_client_id)"
          USERNAME="ci-social-smoke@example.com"
          PASSWORD="$(python3 -c 'import secrets, string; alphabet = string.ascii_letters + string.digits; print("".join(secrets.choice(alphabet) for _ in range(32)) + "Aa1")')"

          if ! aws cognito-idp admin-get-user --user-pool-id "$USER_POOL_ID" --username "$USERNAME" >/dev/null 2>&1; then
            aws cognito-idp admin-create-user \
              --user-pool-id "$USER_POOL_ID" \
              --username "$USERNAME" \
              --user-attributes Name=email,Value="$USERNAME" Name=email_verified,Value=true \
              --message-action SUPPRESS
          fi

          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" \
            --username "$USERNAME" \
            --password "$PASSWORD" \
            --permanent

          TOKEN_JSON="$(aws cognito-idp initiate-auth \
            --auth-flow USER_PASSWORD_AUTH \
            --client-id "$CLIENT_ID" \
            --auth-parameters USERNAME="$USERNAME",PASSWORD="$PASSWORD")"
          ID_TOKEN="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["AuthenticationResult"]["IdToken"])' <<<"$TOKEN_JSON")"

          echo "::add-mask::$ID_TOKEN"
          echo "SOCIAL_API_BEARER_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      - name: Smoke dev deploy
        run: |
          make aws-dev-smoke
          make aws-dev-safety-smoke
          make aws-dev-ai-smoke
          make aws-dev-social-smoke
          make aws-dev-web-smoke
          make aws-dev-router-smoke
          make aws-dev-push-smoke
