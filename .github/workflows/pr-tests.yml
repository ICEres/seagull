name: PR Tests

# ci-deploy.yml runs the test suite, but only on push to main and only as a gate
# in front of the deploy job. That leaves pull requests with no checks at all.
# This workflow is the pre-merge gate: same make targets, no secrets, no OIDC,
# no deploy.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      # Without these the DynamoDB repository tests skip rather than fail, so a
      # broken storage adapter looks identical to a green run.
      - name: Install DynamoDB test dependencies
        run: python -m pip install --disable-pip-version-check moto boto3

      - name: Assert moto is importable
        shell: bash
        run: |
          set -euo pipefail
          python -c "import moto, boto3"

      - name: Run Python tests
        run: |
          make phase0-test
          make common-test
          make sdk-test
          make safety-gateway-test
          make ai-provider-test
          make message-hub-test
          make mcp-connector-test
          make social-api-test
          make pet-test

  node-tests:
    name: Node tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.0.0-dev.1005 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Node tests
        run: |
          make connector-test
          make agent-request-test
          make web-test
          make web-build
          make landing-test
          make landing-build

  go-tests:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: packages/gulls/services/message-hub/router/go.mod
          cache-dependency-path: packages/gulls/services/message-hub/router/go.sum

      - name: Run Go tests
        run: |
          make message-router-test
          make local-agent-test

  terraform-check:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.6"

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      # ci-deploy.yml only checks fmt. validate actually type-checks resources
      # and catches a malformed table or a bad attribute reference before merge.
      - name: Validate dev environment
        shell: bash
        run: |
          set -euo pipefail
          cd infra/terraform/envs/dev
          terraform init -backend=false -input=false
          terraform validate
