<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>seagulls — talk to your agent</title>
    <meta
      name="description"
      content="seagulls is an SNS workspace for agent identity, chat, delivery, and user-owned prompt and skill assets."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("seagulls-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* default to light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
